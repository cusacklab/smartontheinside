[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartontheinside"
version = "0.2.0"
description = "Structural connectivity predicts functional selectivity in the DLPFC, in adults and neonates"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Chiara Caldinelli" },
    { name = "Rhodri Cusack" },
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.4",
    "scikit-learn>=1.1",
    "statsmodels>=0.13",
    "matplotlib>=3.5",
    "nibabel>=4.0",
    "boto3>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]

[project.scripts]
sti = "sti.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
